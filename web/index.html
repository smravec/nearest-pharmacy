<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F5F6F9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#071427" media="(prefers-color-scheme: dark)" />
    <!-- Nominatim identifies browser apps by their Referer, so the origin has to be sent. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="Find the pharmacy closest to you, with distance, opening hours and directions." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Nearest pharmacy</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This app needs JavaScript to find pharmacies near you.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
